name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace web
      - name: Test
        run: npm test --workspace web
      - name: Build
        run: npm run build --workspace web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    # ApiApplicationTests boots the full application context, which needs a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cheap_market
          POSTGRES_USER: cheap_market
          POSTGRES_PASSWORD: cheap_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheap_market -d cheap_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cheap_market
      DB_USER: cheap_market
      DB_PASSWORD: cheap_market
      # Test-only key (base64); not used anywhere else.
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWZvci1naXRodWItYWN0aW9ucy10ZXN0cw==
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Maven
        run: mvn -B test package --file pom.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  deploy:
    needs: [frontend, e2e, backend, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy steps handled by Render via render.yaml"
