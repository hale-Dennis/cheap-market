application:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin@default.com}
      password: ${ADMIN_PASSWORD:defaultpassword}
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 3600000
      refresh-token-expiration: 604800000
  delivery:
    # Flat home-delivery fee, in pesewas (GH₵ 1 = 100). Override per region by region code, e.g.
    #   fee-cents-by-region:
    #     GREATER_ACCRA: 1500
    default-fee-cents: ${DELIVERY_DEFAULT_FEE_CENTS:1000}
    fee-cents-by-region: {}
  storage:
    # Set CLOUDINARY_URL (cloudinary://key:secret@cloud) to store images in Cloudinary.
    # Without it, images are written to UPLOAD_DIR and served from /api/v1/media (local development only).
    cloudinary-url: ${CLOUDINARY_URL:}
    local-dir: ${UPLOAD_DIR:uploads}
spring:
  application:
    name: api
  servlet:
    multipart:
      # Each image may be at most 2 MB; a listing has at most 5.
      max-file-size: 2MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cheap_market}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
